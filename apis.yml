name: Medikine
description: >-
  Medikine is a clinical-stage biopharmaceutical company based in San Diego,
  California, engineering a new class of medicines called PEPTIKINES — synthetic
  peptide mimetics of cytokines and growth-factor receptor agonists. PEPTIKINES
  emulate the beneficial activities of natural cytokines while being much smaller
  in molecular weight and structurally unrelated in sequence, making them
  amenable to enhanced pharmacokinetics, cell targeting, and conditional
  activation without generating neutralizing antibodies to native cytokines. The
  company's lead candidate, MDK-703, is an Fc-fusion protein containing an IL-7
  PEPTIKINE that mimics the T-cell-supporting properties of IL-7, with a pipeline
  spanning oncology, autoimmune, and infectious-disease therapeutics. Medikine is
  a private, venture-backed drug-discovery company and does not publish a public
  API, developer portal, or technical developer surface.
